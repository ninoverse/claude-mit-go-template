name: CI

# The gate definitions live in ninoverse/.github so every Go repository in the
# organization runs the same ones. This file only says *when* to run them and
# what this module's Go floor is.
#
# The reusable workflow's contract is the Makefile: it invokes `make fmt-check`,
# `make vet`, `make lint`, `make test-race`, `make vuln` and `make licenses`, so
# the go invocation behind each gate keeps exactly one definition, here in the
# Makefile.
#
# The agentcfg job below is not part of that. It is written in place because
# `agentcfg check` is not a Go gate — the Rust repositories run the same check
# with no Go in sight — and because being managed should cost a repository no
# workflow file of its own.

on:
  push:
    branches: [main]
  pull_request:

# Belongs here rather than in the called workflow: inside a called workflow,
# `github.workflow` still resolves to this caller's name.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a tag, not @main — a change to @main would land here with no
    # pull request in this repository.
    uses: ninoverse/.github/.github/workflows/go-ci.yml@v1
    with:
      # Must match the `go` directive in go.mod. Nothing else catches a change
      # that breaks it, because every other job runs the current stable
      # toolchain.
      go-version: "1.25"

  # The other direction from the Monday bump pull request: when someone edits
  # .agentprofile.yml — adds a concern, changes the deployment — the composed
  # files go stale, and this fails in their own pull request rather than a bot
  # regenerating them afterwards. The person making the change sees the result,
  # and the fix is `make agentcfg ARGS=sync` locally.
  agentcfg:
    name: agentcfg check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The fetch-and-run lives in the Makefile, like every other command here.
      # `make agentcfg ARGS=check` is the same line a contributor types locally,
      # which is what stops CI and a laptop from disagreeing about the version.
      # No Go setup: the published binary is static and this job never builds.
      - name: Check the composed files against the pinned version
        run: make agentcfg ARGS=check
