name: Bump Version and Tag

# The version logic lives in ninoverse/.github so every repository in the
# organization derives versions the same way. This file only says *when* to run
# it, and supplies the app credentials.
#
# A Go module carries no version field — SemVer git tags are the version — so
# the called workflow reads the commit subject, computes the next tag from the
# tags that already exist, and pushes it. Nothing in the tree changes.
#
# Requires an organization-level RELEASE_APP_ID variable and
# RELEASE_APP_PRIVATE_KEY secret. Without them the run fails immediately with a
# named error rather than obscurely inside the token action.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges in quick succession would otherwise compute the next tag from the
# same starting point and collide. Queue rather than cancel: cancelling a run
# mid-push is the one way to get a tag with nothing behind it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    # Pinned to a tag, not @main — a change to @main would land here with no
    # pull request in this repository.
    uses: ninoverse/.github/.github/workflows/go-bump-version.yml@v1
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
